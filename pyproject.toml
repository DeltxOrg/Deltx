[tool.poetry]
name = "deltx"
version = "0.1.0"
description = "Predictive Software Quality Analytics Platform"
authors = ["Sheane Mario <sheanemario7@gmail.com>"]
readme = "README.md"
packages = [{include = "deltx", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
torch = "^2.3"
# Floor, not cap: 4.48 is the first release with ModernBERT support, which the
# DroidDetect-Base backbone requires.
transformers = ">=4.48"
scikit-learn = "^1.4"
pydantic = "^2.7"
pydantic-settings = "^2.3"
pandas = "^2.2"
numpy = "^1.26"
rich = "^13.7"
click = "^8.1"
scipy = "^1.13"
# DroidCollection ships as parquet; pandas needs an engine to read it.
# Floor, not cap: pyarrow 16.x bundles DLLs that break `import torch` on Windows
# (WinError 1114 on c10.dll) once pandas auto-imports it. 24.0 is conflict-free.
pyarrow = ">=24.0"
# Pulled in transitively by transformers, but dataset.py imports it directly.
# A floor, not a cap: capping this pins transformers to an old release.
huggingface-hub = ">=0.23"
# Pulled in transitively by transformers, but the extraction CLI imports it
# directly for the history-traversal progress bar. A floor, not a cap.
tqdm = ">=4.65"
# Static PNG rendering for the results-visualisation CLI (deltx-visualize).
matplotlib = "^3.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^3.7"

[tool.poetry.scripts]
# Detection CLI; equivalent to `python -m deltx.detection.cli`.
deltx-detect = "deltx.detection.cli:cli"
# Stage 1 extraction CLI; equivalent to `python extract_ai_confidence.py`.
deltx-extract = "deltx.extraction.cli:main"
# Results visualisation; equivalent to `python visualize_ai_confidence.py`.
deltx-visualize = "deltx.extraction.visualize:main"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B"]
# ANN101/ANN102 (annotating self/cls) are deprecated in ruff and add no value.
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
# Tests rely on `assert`; the language-model import guard is intentionally broad.
# S603/S607: extraction tests drive real `git` with literal, trusted arguments.
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
# `Path(...)` is immutable, so it is safe as a default argument value.
extend-immutable-calls = ["pathlib.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# transformers ships only partial type information; treat it as untyped so
# strict mode does not flag every model/tokenizer call as an untyped call.
module = ["transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# scipy ships no type stubs (scipy-stubs is a separate, unbundled package).
module = ["scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# scikit-learn ships no type stubs.
module = ["sklearn.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pandas ships no py.typed marker (pandas-stubs is a separate, unbundled package).
module = ["pandas.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# joblib ships no usable type information under strict mode; treat it as untyped
# so its calls are not flagged as untyped-call errors.
module = ["joblib.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# tqdm ships no bundled stubs (types-tqdm is a separate, unbundled package);
# the extraction CLI uses only its progress-bar wrapper.
module = ["tqdm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# matplotlib ships only partial type information; the visualisation module uses
# the pyplot/Axes/Figure surface, which strict mode would otherwise flag.
module = ["matplotlib.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not slow"` is what actually keeps the default suite offline; the marker
# alone deselects nothing. Without it `pytest` downloads the 569 MB checkpoint.
# Run the excluded tests with `pytest -m slow`.
addopts = "--cov=deltx --cov-report=term-missing -v -m 'not slow'"
markers = [
    "slow: tests that require the language model to be downloaded/cached",
    "integration: end-to-end tests exercising the full detection pipeline",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
